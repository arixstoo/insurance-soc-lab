# Detection test cases.
# Each case feeds its log lines, in order, into one wazuh-logtest session
# and checks the rule fired by the LAST line.
#
#   expect:     rule id that must fire on the last line            (a POSITIVE case for it)
#   expect_not: rule id that must NOT fire on the last line        (a NEGATIVE case for it)
#               A case may have both: "this fires, and that one does not".
#   clock:      "night" (02:00) or "day" (12:00) manager clock, for <time> rules
#   at:         optional, seconds offset of each line. The case then runs on the replay
#               engine (detection/replay/), whose clock follows these offsets: this is how
#               time windows (timeframe / frequency) are tested without waiting.
#   real:       true = the lab test client (real/client/lab_traffic.py, compose profile
#               `real`) also sends this web request, with curl, to the real nginx host.
#               Cases with `expect` are the malformed requests, the others the benign ones.
#
# Every rule in detection/rules/insurco_rules.xml needs at least one positive and one
# negative case: detection/tests/test_rule_coverage.py fails otherwise.
#
# Placeholders: {ts} = syslog timestamp, {iso_ts} = RFC 3339 syslog timestamp,
# {apache_ts} = Apache / nginx timestamp, {pg_ts} = PostgreSQL jsonlog timestamp.
# All IPs are documentation ranges (RFC 5737) or lab-private ranges (10.20.0.0/16).
# 10.20.5.10 is the allow-listed internal vulnerability scanner (detection/lists/scanner-ips).
# 10.20.60.50 is the lab test client of the real hosts (docker-compose.yml, profile `real`).

cases:
  # ---------- SSH ----------
  - name: single failed password stays a built-in alert
    lines:
      - "{ts} srv-linux-01 sshd[2101]: Failed password for root from 203.0.113.10 port 51001 ssh2"
    expect: "5760"
    expect_not: "100100"

  - name: ssh brute force - 6 failures from one IP
    lines:
      - "{ts} srv-linux-01 sshd[2101]: Failed password for root from 203.0.113.10 port 51001 ssh2"
      - "{ts} srv-linux-01 sshd[2102]: Failed password for root from 203.0.113.10 port 51002 ssh2"
      - "{ts} srv-linux-01 sshd[2103]: Failed password for admin from 203.0.113.10 port 51003 ssh2"
      - "{ts} srv-linux-01 sshd[2104]: Failed password for admin from 203.0.113.10 port 51004 ssh2"
      - "{ts} srv-linux-01 sshd[2105]: Failed password for svc_backup from 203.0.113.10 port 51005 ssh2"
      - "{ts} srv-linux-01 sshd[2106]: Failed password for svc_backup from 203.0.113.10 port 51006 ssh2"
    expect: "100100"

  - name: failures spread over different IPs are not a brute force
    lines:
      - "{ts} srv-linux-01 sshd[2201]: Failed password for root from 203.0.113.21 port 51001 ssh2"
      - "{ts} srv-linux-01 sshd[2202]: Failed password for root from 203.0.113.22 port 51002 ssh2"
      - "{ts} srv-linux-01 sshd[2203]: Failed password for root from 203.0.113.23 port 51003 ssh2"
      - "{ts} srv-linux-01 sshd[2204]: Failed password for root from 203.0.113.24 port 51004 ssh2"
      - "{ts} srv-linux-01 sshd[2205]: Failed password for root from 203.0.113.25 port 51005 ssh2"
      - "{ts} srv-linux-01 sshd[2206]: Failed password for root from 203.0.113.26 port 51006 ssh2"
    expect_not: "100100"

  - name: 6 failures from one IP in 115 s is a brute force (window 120 s)
    at: [0, 23, 46, 69, 92, 115]
    lines:
      - "{ts} srv-linux-01 sshd[2211]: Failed password for root from 203.0.113.27 port 51001 ssh2"
      - "{ts} srv-linux-01 sshd[2212]: Failed password for root from 203.0.113.27 port 51002 ssh2"
      - "{ts} srv-linux-01 sshd[2213]: Failed password for root from 203.0.113.27 port 51003 ssh2"
