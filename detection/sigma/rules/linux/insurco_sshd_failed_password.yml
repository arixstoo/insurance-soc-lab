title: SSH Failed Password
id: b1135432-901c-4de3-8370-0e562cf800c3
name: insurco_sshd_failed_password
status: test
description: |
    One failed password on sshd. Building block of the SSH brute-force correlation
    (insurco_ssh_brute_force), not an alert on its own. Wazuh: built-in rule 5760.
references:
    - https://github.com/arixstoo/insurance-soc-lab/blob/main/docs/detection-catalog.md#sigma-rules
author: insurance-soc-lab
date: 2026-11-16
tags:
    - attack.credential-access
    - attack.t1110.001
logsource:
    product: linux
    service: sshd
detection:
    keywords:
        - 'Failed password for '
    condition: keywords
falsepositives:
    - Users mistyping their password
level: informational
wazuh_rules:
    - '5760'
