title: New Account Added To An Administrators Group Within 10 Minutes
id: a7fac69e-f6e8-4bcc-9de9-820a1a103005
name: insurco_win_rogue_admin
status: test
description: |
    An account is created, then the SAME account is added to an administrators group within
    10 minutes; the actor may differ. Same account = the new account's SID (4720 TargetSid)
    is the added member's SID (4728 / 4732 MemberSid).
references:
    - https://github.com/arixstoo/insurance-soc-lab/blob/main/docs/detection-catalog.md#sigma-rules
author: insurance-soc-lab
date: 2026-11-16
tags:
    - attack.persistence
    - attack.t1136.001
    - attack.t1098
correlation:
    type: temporal_ordered
    rules:
        - insurco_win_account_created
        - insurco_win_admin_group_member_added
    group-by:
        - account_sid
    aliases:
        account_sid:
            insurco_win_account_created: TargetSid
            insurco_win_admin_group_member_added: MemberSid
    timespan: 10m
    generate: true
falsepositives:
    - A new admin account created and promoted under an approved change
level: critical
wazuh_rules:
    - '100145'
