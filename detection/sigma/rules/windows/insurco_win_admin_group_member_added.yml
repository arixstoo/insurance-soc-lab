title: Member Added To An Administrators Group
id: e9289e85-663b-4641-a3c6-02445a846480
name: insurco_win_admin_group_member_added
status: test
description: |
    A member was added to the local Administrators group (SID S-1-5-32-544, event 4732) or to
    Domain Admins (RID 512, event 4728 on a domain controller). Matched on the group SID, not
    its name: names are localised ("Administrateurs" on a French Windows).
references:
    - https://github.com/arixstoo/insurance-soc-lab/blob/main/docs/detection-catalog.md#sigma-rules
author: insurance-soc-lab
date: 2026-11-16
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: windows
    service: security
detection:
    selection_event:
        EventID:
            - 4728
            - 4732
    selection_group:
        - TargetSid: 'S-1-5-32-544'
        - TargetSid|endswith: '-512'
    condition: all of selection_*
falsepositives:
    - An approved administrator change (check the change ticket)
level: critical
wazuh_rules:
    - '100144'
