title: Probe For Secrets Or Backup Files
id: 8f29ce3a-06e8-4087-8090-ddffae2c02b4
name: insurco_web_secrets_probe
status: test
description: |
    Request for a file only an attacker asks for: .env, .git/, database dumps and backups,
    PHP configuration files. The internal vulnerability scanner is excluded.
references:
    - https://github.com/arixstoo/insurance-soc-lab/blob/main/docs/detection-catalog.md#sigma-rules
author: insurance-soc-lab
date: 2026-11-16
tags:
    - attack.reconnaissance
    - attack.t1595.003
logsource:
    category: webserver
detection:
    selection_file:
        cs-uri-stem|endswith:
            - '/.env'
            - '.sql'
            - '.bak'
            - '.old'
            - '/config.php'
            - '/wp-config.php'
    selection_git:
        cs-uri-stem|contains: '/.git/'
    filter_scanner:
        c-ip|expand: '%insurco_scanner_ips%'
    condition: 1 of selection_* and not filter_scanner
falsepositives:
    - Internet background noise on exposed applications (keep the level low)
level: medium
wazuh_rules:
    - '100123'
