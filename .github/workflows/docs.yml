name: docs

# MkDocs Material site from docs/: built (strict) on every pull request that touches it,
# published to GitHub Pages from main. Repository setting: Pages -> Source = GitHub Actions.
on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, requirements-docs.txt, scripts/mkdocs_hooks.py, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, mkdocs.yml, requirements-docs.txt, scripts/mkdocs_hooks.py, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (tag in the comment); Dependabot keeps both up to date.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-docs.txt
      - name: Build (strict - a broken link or a page missing from the nav fails)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
