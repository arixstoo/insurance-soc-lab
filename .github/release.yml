# Categories for automatically generated release notes (Releases -> Generate release notes).
# The hand-written CHANGELOG.md stays the reference; this only sorts merged pull requests.
changelog:
  exclude:
    labels: [ignore-for-release]
  categories:
    - title: Detections
      labels: [detection, sigma]
    - title: Response
      labels: [response]
    - title: Lab and simulator
      labels: [simulator, enhancement]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: CI, security and dependencies
      labels: [ci, security, dependencies, github_actions, docker]
    - title: Other changes
      labels: ["*"]
