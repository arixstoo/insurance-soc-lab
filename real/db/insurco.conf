# real-db-01 - PostgreSQL settings (conf.d, on top of Ubuntu's postgresql.conf)
listen_addresses = '*'

# --- logging: one JSON object per line, read by the Wazuh agent
logging_collector = on
log_destination = 'jsonlog'
log_directory = '/var/log/postgresql'
# jsonlog replaces the .log suffix: the file is postgresql-audit.json
log_filename = 'postgresql-audit.log'
log_rotation_age = 0
log_rotation_size = 0
log_file_mode = 0640

# --- pgaudit: the audit trail of customer data access
shared_preload_libraries = 'pgaudit'
pgaudit.log = 'read, write, ddl, role'
pgaudit.log_catalog = off       # no line for psql's own catalog queries
pgaudit.log_relation = on       # one line per table touched: the table is a field
pgaudit.log_rows = on           # rows returned: what makes a read "bulk" (rule 100131)
pgaudit.log_parameter = off     # never log bound values (customer data)
