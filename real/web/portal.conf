# real-web-01 - nginx site for the static claims portal (real/web/site/).
# Access log in nginx's default "combined" format: the same layout as Apache's, decoded by
# Wazuh's web-accesslog decoder like the simulated srv-web-01 log.
server {
    listen 80 default_server;
    server_name real-web-01;
    server_tokens off;

    root /srv/claims-portal;
    index index.html;
    access_log /var/log/nginx/access.log combined;

    # Pretty URLs of the portal: /claims/search, /policies/12345, ... -> <path>.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
