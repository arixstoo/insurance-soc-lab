title = "insurance-soc-lab"

[extend]
useDefault = true

# Public lab defaults shipped by wazuh/wazuh-docker (documented in SECURITY.md).
# scripts/rotate-passwords.sh replaces them in git-ignored files (stack/secrets/, .env).
[allowlist]
description = "Wazuh upstream lab defaults"
paths = [
  '''^stack/config/wazuh_indexer/internal_users\.yml$''',
  '''^stack/config/wazuh_cluster/wazuh_manager\.conf$''',
  '''^stack/config/wazuh_dashboard/wazuh\.yml$''',
  '''^\.env\.example$''',
]
