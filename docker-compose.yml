# insurance-soc-lab - the whole lab in one command:  make up  (or: docker compose up -d --build)
# Run scripts/rotate-passwords.sh first: it replaces the public lab defaults (SECURITY.md).
# Wazuh services are adapted from wazuh/wazuh-docker (single-node, GPLv2), see stack/NOTICE.md.
name: ${COMPOSE_PROJECT_NAME:-islab}

# The agent image is built once (by srv-linux-01) and reused by the other hosts.
x-agent: &agent
  image: insurance-soc-lab/agent:${WAZUH_VERSION:-4.14.9}
  pull_policy: never
  restart: unless-stopped
  networks: [soc]
  depends_on:
    wazuh.manager: { condition: service_healthy }
    simulator: { condition: service_healthy }

services:
  # ------------------------------------------------------------------ SIEM
  wazuh.manager:
    image: wazuh/wazuh-manager:${WAZUH_VERSION:-4.14.9}
    hostname: wazuh.manager
    restart: unless-stopped
    networks: [soc]
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    # No published ports: agents and the dashboard reach the manager (1514/1515,
    # API 55000) on the internal network. Scripts use `docker exec`.
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${API_PASSWORD}
      - TZ=${LAB_TZ:-Africa/Algiers}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./stack/certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ./stack/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./stack/certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      - ./stack/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf:ro
      # Detection-as-code: the rules live in git, not inside the container
      - ./detection/rules/insurco_rules.xml:/var/ossec/etc/rules/insurco_rules.xml:ro
      - ./detection/decoders/0005-insurco_decoders.xml:/var/ossec/etc/decoders/0005-insurco_decoders.xml:ro
      # CDB lists are compiled next to their text file, so they cannot be mounted read-only
      # in place: the image entrypoint copies /wazuh-config-mount into /var/ossec at start.
      - ./detection/lists:/wazuh-config-mount/etc/lists/insurco:ro
    healthcheck:
      # Healthy once the daemons the agents and the dashboard rely on are all running
      test: ["CMD-SHELL", "test $$(/var/ossec/bin/wazuh-control status | grep -cE 'wazuh-(analysisd|remoted|authd|db|apid) is running') -eq 5"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
      start_interval: 5s

  wazuh.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION:-4.14.9}
    hostname: wazuh.indexer
    restart: unless-stopped
    networks: [soc]
    ports:
      - "127.0.0.1:9200:9200"     # OpenSearch API, local only
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./stack/certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - ./stack/certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key:ro
      - ./stack/certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:ro
      - ./stack/certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - ./stack/certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
      - ./stack/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      # Generated by scripts/rotate-passwords.sh (git-ignored); falls back to the public defaults
      - ${INDEXER_USERS_FILE:-./stack/config/wazuh_indexer/internal_users.yml}:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
    healthcheck:
      # Admin client certificate, no password; fails until the security index is initialised
      test: ["CMD-SHELL", "curl -sf --cacert /usr/share/wazuh-indexer/config/certs/root-ca.pem --cert /usr/share/wazuh-indexer/config/certs/admin.pem --key /usr/share/wazuh-indexer/config/certs/admin-key.pem 'https://wazuh.indexer:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
      start_interval: 5s

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION:-4.14.9}
    hostname: wazuh.dashboard
    restart: unless-stopped
    networks: [soc]
    ports:
      - "127.0.0.1:443:5601"      # https://localhost
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${API_PASSWORD}
    volumes:
      - ./stack/certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ./stack/certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - ./stack/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./stack/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      # Generated by scripts/rotate-passwords.sh (git-ignored); falls back to the public defaults
      - ${DASHBOARD_API_CONFIG:-./stack/config/wazuh_dashboard/wazuh.yml}:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    healthcheck:
      # Logs in as kibanaserver: also proves the dashboard and indexer agree on its password
      test: ["CMD-SHELL", "curl -sf --cacert /usr/share/wazuh-dashboard/certs/root-ca.pem -u \"$${DASHBOARD_USERNAME}:$${DASHBOARD_PASSWORD}\" https://wazuh.dashboard:5601/api/status >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
      start_interval: 5s
    depends_on:
      wazuh.indexer: { condition: service_healthy }
      wazuh.manager: { condition: service_healthy }

  # ------------------------------------------------------------------ telemetry
  simulator:
    build: ./simulator
    image: insurance-soc-lab/simulator:3.1.0
    restart: unless-stopped
    networks: [soc]
    environment:
      - TZ=${LAB_TZ:-Africa/Algiers}
    command:
      - run
      - --out=/var/log/insurco
      - --rate=${SIM_RATE:-0.7}
      - --attack-min=${SIM_ATTACK_MIN:-120}
      - --attack-max=${SIM_ATTACK_MAX:-300}
      # Office-hours profile (SIM_RATE is the peak rate); SIM_PROFILE=flat for a constant rate
      - --profile=${SIM_PROFILE:-office}
      - --office-hours=${SIM_OFFICE_HOURS:-08-18}
      - --night-factor=${SIM_NIGHT_FACTOR:-0.1}
      - --weekend-factor=${SIM_WEEKEND_FACTOR:-0.2}
      - --weekend-days=${SIM_WEEKEND_DAYS:-fri,sat}
    volumes:
      - insurco-logs:/var/log/insurco

  # ------------------------------------------------------------------ simulated hosts
  # Each agent mounts ONLY its own host folder, read-only: one event = one alert.
  srv-linux-01:
    <<: *agent
    build:
      context: ./agents
      args:
        WAZUH_VERSION: ${WAZUH_VERSION:-4.14.9}
    pull_policy: build
    hostname: srv-linux-01
    environment:
      - WAZUH_MANAGER=wazuh.manager
      - AGENT_NAME=srv-linux-01
      - AGENT_GROUP=default
      - LOG_FORMAT=syslog
      - LOG_FILE=auth.log
    volumes:
      - type: volume
        source: insurco-logs
        target: /var/log/insurco
        read_only: true
        volume: { subpath: srv-linux-01 }

  srv-web-01:
    <<: *agent
    hostname: srv-web-01
    environment:
      - WAZUH_MANAGER=wazuh.manager
      - AGENT_NAME=srv-web-01
      - AGENT_GROUP=default
      - LOG_FORMAT=apache
      - LOG_FILE=access.log
    volumes:
      - type: volume
        source: insurco-logs
        target: /var/log/insurco
        read_only: true
        volume: { subpath: srv-web-01 }

  srv-db-01:
    <<: *agent
    hostname: srv-db-01
    environment:
      - WAZUH_MANAGER=wazuh.manager
      - AGENT_NAME=srv-db-01
      - AGENT_GROUP=default
      - LOG_FORMAT=json
      - LOG_FILE=db_audit.json
    volumes:
      - type: volume
        source: insurco-logs
        target: /var/log/insurco
        read_only: true
        volume: { subpath: srv-db-01 }

  ws-claims-01:
    <<: *agent
    hostname: ws-claims-01
    environment:
      - WAZUH_MANAGER=wazuh.manager
      - AGENT_NAME=ws-claims-01
      - AGENT_GROUP=default
      - LOG_FORMAT=json
      - LOG_FILE=winsec.json
    volumes:
      - type: volume
        source: insurco-logs
        target: /var/log/insurco
        read_only: true
        volume: { subpath: ws-claims-01 }

networks:
  soc:
    name: islab-soc

volumes:
  insurco-logs:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
